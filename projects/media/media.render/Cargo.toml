[package]
name = "media-render"
description = "Frame orchestration: scene films with audio, sound-effect export and a scene-free image pipeline (decode, process, encode)"
readme = "readme.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
media-types = { workspace = true }
media-image = { workspace = true }
media-codec = { workspace = true }
geometry = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
media-scene = { workspace = true, optional = true }
media-motion = { workspace = true, optional = true }
media-raster = { workspace = true, optional = true }
media-text = { workspace = true, optional = true }
media-audio = { workspace = true, optional = true }
media-synthesis = { workspace = true, optional = true }
media-voice = { workspace = true, optional = true }
media-post = { workspace = true, optional = true }
media-vector = { workspace = true, optional = true }
media-voxel = { workspace = true, optional = true }
media-layout = { workspace = true, optional = true }

[features]
default = ["scene"]
scene = ["dep:geometry", "dep:serde_json", "dep:media-scene", "dep:media-motion", "dep:media-raster", "dep:media-text", "media-text/blocks", "dep:media-audio", "dep:media-post"]
image-pipeline = ["dep:media-post"]
sfx-export = ["dep:media-synthesis"]
voice-export = ["dep:media-voice"]
vector-export = ["dep:geometry", "dep:media-vector", "dep:media-raster", "media-codec/svg"]
voxel-export = ["dep:media-voxel", "dep:media-raster", "media-codec/obj"]
layout-export = ["dep:media-layout", "dep:media-raster", "dep:media-text", "media-text/paint"]

[dev-dependencies]
serde_json = { workspace = true }
