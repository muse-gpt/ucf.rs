[package]
name = "media-codec"
description = "Host codecs: image and video decode, audio decode and Media Foundation encoding"
readme = "readme.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
media-types = { workspace = true }
media-image = { workspace = true }
media-vector = { workspace = true, optional = true }
media-voxel = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[features]
svg = ["dep:media-vector"]
obj = ["dep:media-voxel"]
