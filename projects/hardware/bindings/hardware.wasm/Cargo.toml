[package]
name = "hardware-wasm"
description = "UCF Wasm cdylib：导出 C ABI，Web 默认 CPU 应用契约探针"
readme = "readme.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
keywords = ["hardware", "wasm", "webassembly"]
categories = ["wasm"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
hardware = { path = "../../hardware", default-features = false, features = ["cpu"] }

[dev-dependencies]
wasmtime = "28"
