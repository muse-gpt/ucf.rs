[package]
name = "ucf"
description = "Unified Compute Fabric - public facade"
readme = "readme.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["cpu"]
cpu = ["dep:ucf-backend-cpu"]
cuda = ["dep:ucf-backend-cuda"]
dx12 = ["dep:ucf-backend-dx12"]
vulkan = ["dep:ucf-backend-vulkan"]

[dependencies]
ucf-types = { workspace = true }
ucf-ir = { workspace = true }
ucf-capability = { workspace = true }
ucf-optimize = { workspace = true }
ucf-scheduler = { workspace = true }
ucf-runtime = { workspace = true }
ucf-backend-cpu = { workspace = true, optional = true }
ucf-backend-cuda = { workspace = true, optional = true }
ucf-backend-dx12 = { workspace = true, optional = true }
ucf-backend-vulkan = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
ucf-backend-cpu = { workspace = true }
ucf-backend-cuda = { workspace = true }
ucf-backend-dx12 = { workspace = true }
ucf-backend-vulkan = { workspace = true }
ucf-backend-rocm = { workspace = true }
