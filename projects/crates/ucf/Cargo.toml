[package]
name = "ucf"
description = "Unified Compute Fabric — public facade"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
cuda = ["dep:ucf-backend-cuda"]
dx12 = ["dep:ucf-backend-dx12"]

[dependencies]
ucf-types = { workspace = true }
ucf-ir = { workspace = true }
ucf-capability = { workspace = true }
ucf-optimize = { workspace = true }
ucf-scheduler = { workspace = true }
ucf-runtime = { workspace = true }
ucf-backend-cuda = { path = "../backends/ucf-backend-cuda", optional = true }
ucf-backend-dx12 = { path = "../backends/ucf-backend-dx12", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
