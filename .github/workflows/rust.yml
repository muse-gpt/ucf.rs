name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install fonts (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: cargo test
        run: cargo test --workspace

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        run: cargo build --release --workspace

  # Examples are a separate workspace and only validate graph build + dry-run.
  # This job is not evidence of real CPU/GPU execution.
  examples:
    name: Hardware graph examples (dry-run only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/hardware-graphs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build examples
        run: cargo build --workspace

      - name: cargo run examples (graph build + dry-run only)
        run: |
          for pkg in $(cargo metadata --format-version 1 --no-deps | jq -r '.packages[].name'); do
            cargo run -p "$pkg"
          done
