[workspace]
resolver = "2"
members = [
    "projects/hardware/hardware",
    "projects/hardware/hardware.types",
    "projects/hardware/hardware.ir",
    "projects/hardware/hardware.capability",
    "projects/hardware/hardware.optimize",
    "projects/hardware/hardware.scheduler",
    "projects/hardware/hardware.emitter",
    "projects/hardware/hardware.program",
    "projects/hardware/hardware.runtime",
    "projects/hardware/hardware.backends/hardware.backend.cpu",
    "projects/hardware/hardware.backends/hardware.backend.cuda",
    "projects/hardware/hardware.backends/hardware.backend.dx12",
    "projects/hardware/hardware.backends/hardware.backend.vulkan",
    "projects/hardware/hardware.backends/hardware.backend.rocm",
    "projects/hardware/bindings/hardware.wasm",
    "projects/geometry/geometry",
    "projects/geometry/geometry.types",
    "projects/geometry/geometry.motion",
    "projects/media/media",
    "projects/media/media.types",
    "projects/media/media.image",
    "projects/media/media.scene",
    "projects/media/media.raster",
    "projects/media/media.canvas",
    "projects/media/media.text",
    "projects/media/media.codec",
    "projects/media/media.audio",
    "projects/media/media.render",
    "projects/media/media.post",
]
default-members = [
    "projects/hardware/hardware",
    "projects/hardware/hardware.types",
    "projects/hardware/hardware.ir",
    "projects/hardware/hardware.capability",
    "projects/hardware/hardware.optimize",
    "projects/hardware/hardware.scheduler",
    "projects/hardware/hardware.emitter",
    "projects/hardware/hardware.program",
    "projects/hardware/hardware.runtime",
    "projects/hardware/hardware.backends/hardware.backend.cpu",
    "projects/hardware/hardware.backends/hardware.backend.cuda",
    "projects/hardware/hardware.backends/hardware.backend.dx12",
    "projects/hardware/hardware.backends/hardware.backend.vulkan",
    "projects/hardware/hardware.backends/hardware.backend.rocm",
    "projects/geometry/geometry",
    "projects/geometry/geometry.types",
    "projects/geometry/geometry.motion",
    "projects/media/media",
    "projects/media/media.types",
    "projects/media/media.image",
    "projects/media/media.scene",
    "projects/media/media.raster",
    "projects/media/media.canvas",
    "projects/media/media.text",
    "projects/media/media.codec",
    "projects/media/media.audio",
    "projects/media/media.render",
    "projects/media/media.post",
]
exclude = [
    "projects/.DS_Store",
    "examples/hardware-graphs",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Aster <192607617@qq.com>"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
fontdue = "0.9"
libloading = "0.8"
ash = "0.38"
naga = { version = "24", default-features = false, features = ["wgsl-in", "spv-out"] }
rspirv = "0.12"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

geometry = { path = "projects/geometry/geometry" }
geometry-types = { path = "projects/geometry/geometry.types" }
geometry-motion = { path = "projects/geometry/geometry.motion" }

media = { path = "projects/media/media" }
media-types = { path = "projects/media/media.types" }
media-image = { path = "projects/media/media.image" }
media-scene = { path = "projects/media/media.scene" }
media-raster = { path = "projects/media/media.raster" }
media-canvas = { path = "projects/media/media.canvas" }
media-text = { path = "projects/media/media.text" }
media-codec = { path = "projects/media/media.codec" }
media-audio = { path = "projects/media/media.audio" }
media-render = { path = "projects/media/media.render" }
media-post = { path = "projects/media/media.post" }

hardware = { path = "projects/hardware/hardware" }
hardware-types = { path = "projects/hardware/hardware.types" }
hardware-ir = { path = "projects/hardware/hardware.ir" }
hardware-capability = { path = "projects/hardware/hardware.capability" }
hardware-optimize = { path = "projects/hardware/hardware.optimize" }
hardware-scheduler = { path = "projects/hardware/hardware.scheduler" }
hardware-emitter = { path = "projects/hardware/hardware.emitter" }
hardware-program = { path = "projects/hardware/hardware.program" }
hardware-runtime = { path = "projects/hardware/hardware.runtime" }
hardware-backend-cuda = { path = "projects/hardware/hardware.backends/hardware.backend.cuda" }
hardware-backend-dx12 = { path = "projects/hardware/hardware.backends/hardware.backend.dx12" }
hardware-backend-vulkan = { path = "projects/hardware/hardware.backends/hardware.backend.vulkan" }
hardware-backend-rocm = { path = "projects/hardware/hardware.backends/hardware.backend.rocm" }
hardware-backend-cpu = { path = "projects/hardware/hardware.backends/hardware.backend.cpu" }

[profile.release]
lto = true
panic = "abort"
