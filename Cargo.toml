[workspace]
resolver = "2"
members = [
    "projects/crates/ucf-types",
    "projects/crates/ucf-ir",
    "projects/crates/ucf",
    "projects/crates/ucf-capability",
    "projects/crates/ucf-optimize",
    "projects/crates/ucf-scheduler",
    "projects/crates/ucf-emitter",
    "projects/crates/ucf-runtime",
    "projects/examples/cfd-navier-stokes",
    "projects/examples/cfd-lbm",
    "projects/examples/simulation-rigid-body",
    "projects/examples/simulation-sph",
    "projects/examples/simulation-cloth",
    "projects/examples/simulation-nbody",
    "projects/examples/science-molecular-dynamics",
    "projects/examples/science-monte-carlo",
    "projects/examples/science-conjugate-gradient",
    "projects/examples/science-fft",
    "projects/examples/graphics-raster",
    "projects/examples/graphics-ray-tracing",
    "projects/examples/graphics-post-process",
    "projects/examples/deep-learning-train-step",
    "projects/examples/deep-learning-attention",
    "projects/examples/deep-learning-conv2d",
    "projects/examples/image-video-image-pipeline",
    "projects/examples/image-video-video-pipeline",
    "projects/examples/ai-fusion-dlss",
    "projects/examples/ai-fusion-physics-render-denoise",
    "projects/examples/database-query",
    "projects/examples/robotics-robot-loop",
    "projects/examples/distributed-ddp-train",
    "projects/examples/distributed-tensor-parallel",
    "projects/examples/mixed-cloud-game-and-inference",
    "projects/examples/exotic-hardware-fpga-accel",
    "projects/examples/exotic-hardware-pim-matmul",
    "projects/crates/ucf-backends/ucf-backend-cuda",
    "projects/crates/ucf-backends/ucf-backend-dx12",
    "projects/crates/ucf-backends/ucf-backend-vulkan",
    "projects/crates/ucf-backends/ucf-backend-rocm",
    "projects/crates/ucf-backends/ucf-backend-cpu",
]
default-members = [
    "projects/crates/ucf",
    "projects/crates/ucf-types",
    "projects/crates/ucf-ir",
    "projects/crates/ucf-capability",
    "projects/crates/ucf-optimize",
    "projects/crates/ucf-scheduler",
    "projects/crates/ucf-emitter",
    "projects/crates/ucf-runtime",
    "projects/examples/cfd-navier-stokes",
    "projects/examples/cfd-lbm",
    "projects/examples/simulation-rigid-body",
    "projects/examples/simulation-sph",
    "projects/examples/simulation-cloth",
    "projects/examples/simulation-nbody",
    "projects/examples/science-molecular-dynamics",
    "projects/examples/science-monte-carlo",
    "projects/examples/science-conjugate-gradient",
    "projects/examples/science-fft",
    "projects/examples/graphics-raster",
    "projects/examples/graphics-ray-tracing",
    "projects/examples/graphics-post-process",
    "projects/examples/deep-learning-train-step",
    "projects/examples/deep-learning-attention",
    "projects/examples/deep-learning-conv2d",
    "projects/examples/image-video-image-pipeline",
    "projects/examples/image-video-video-pipeline",
    "projects/examples/ai-fusion-dlss",
    "projects/examples/ai-fusion-physics-render-denoise",
    "projects/examples/database-query",
    "projects/examples/robotics-robot-loop",
    "projects/examples/distributed-ddp-train",
    "projects/examples/distributed-tensor-parallel",
    "projects/examples/mixed-cloud-game-and-inference",
    "projects/examples/exotic-hardware-fpga-accel",
    "projects/examples/exotic-hardware-pim-matmul",
    "projects/crates/ucf-backends/ucf-backend-cuda",
    "projects/crates/ucf-backends/ucf-backend-dx12",
    "projects/crates/ucf-backends/ucf-backend-cpu",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Aster <192607617@qq.com>"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
libloading = "0.8"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_Threading",
] }

ucf-types = { path = "projects/crates/ucf-types" }
ucf = { path = "projects/crates/ucf" }
ucf-ir = { path = "projects/crates/ucf-ir" }
ucf-capability = { path = "projects/crates/ucf-capability" }
ucf-optimize = { path = "projects/crates/ucf-optimize" }
ucf-scheduler = { path = "projects/crates/ucf-scheduler" }
ucf-emitter = { path = "projects/crates/ucf-emitter" }
ucf-runtime = { path = "projects/crates/ucf-runtime" }
ucf-backend-cuda = { path = "projects/crates/ucf-backends/ucf-backend-cuda" }
ucf-backend-dx12 = { path = "projects/crates/ucf-backends/ucf-backend-dx12" }
ucf-backend-vulkan = { path = "projects/crates/ucf-backends/ucf-backend-vulkan" }
ucf-backend-rocm = { path = "projects/crates/ucf-backends/ucf-backend-rocm" }
ucf-backend-cpu = { path = "projects/crates/ucf-backends/ucf-backend-cpu" }

[profile.release]
lto = true
panic = "abort"
